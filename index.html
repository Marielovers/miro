<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eef1" />
    <title>미로의 미로미로미로링</title>
  </head>
  <body>
    <main id="stage" aria-label="Live2D 아바타">
      <canvas id="live2d" aria-label="드래그 가능한 Live2D 캐릭터"></canvas>
      <button id="enable-camera" hidden type="button">카메라 켜기</button>
      <section id="title-screen" aria-label="시작 화면">
        <div class="title-content">
          <div class="title-kicker">MIRO • LIVE2D</div>
          <h1>미로의<br>미로미로미로링</h1>
          <button id="start-game" type="button" disabled>불러오는 중…</button>
          <p id="start-status" aria-live="polite">모델을 준비하고 있어요.</p>
        </div>
      </section>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
